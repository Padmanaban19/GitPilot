[project]
name = "gitpilot"
version = "0.1.0"
description = "CLI toolkit for automating GitHub organization management at scale."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "typer>=0.27.2",
]

[project.scripts]
gitpilot = "gitpilot:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
